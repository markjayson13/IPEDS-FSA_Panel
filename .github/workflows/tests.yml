name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: markjayson13/FSAVolumeReports_Panel
          ref: f67f8614500e175e74fb992ca356f94c1a243120
          path: upstream-fsa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-source.txt
      - name: Linkage, merge, exports and reproduction contracts
        env:
          FSA_SOURCE_REPO: ${{ github.workspace }}/upstream-fsa
        run: python -m unittest discover -s tests -v
      - name: Analysis fixtures (release integration tests require the external bundle)
        run: python -m unittest discover -s Analysis/Tests -v
